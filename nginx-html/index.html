<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sojourner Media Server</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    </style>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        a,
        a:visited {
            min-width: 80px;
            color: white;
            text-decoration: none;
            padding: 8px;
            margin: 8px;
            border-radius: 5px;
            background-color: #C04848;
            transition: background-color 0.3s;
            display: inline-block
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2f2d2d;
        }

        .container img {
            object-fit: contain;
            display: block;
            margin: auto;
        }

        @media only screen and (max-width: 768px) and (orientation: portrait) {
            .container img {
                transform: translateX(-30%);
            }
        }

        .container::before {
            content: '';
            z-index: 10;
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            background: linear-gradient(rgb(72, 0, 72, 0.8), rgb(192, 72, 72, 0.8));
        }

        header {
            height: 100%;
            width: 100%;
            text-align: center;
            padding-top: 100px;
            color: white;
            overflow: hidden;
            position: fixed;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* background: linear-gradient(135deg, #121212, #c27676); */
                color: #ffffff;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #ffffff;
                color: #000000;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/images/sojourner.webp" alt="Sojourner Media Server">
    </div>
    <header>
        <section class='hero-header'>
            <h1>Sojourner</h1>
            <nav>
                <a target="_blank" href="http://sojourner/torrent">bittorrent</a>
                <a target="_blank" href="http://sojourner/sonarr">tv</a>
                <a target="_blank" href="http://sojourner/radarr">movies</a>
                <a target="_blank" href="http://sojourner:5055">overseerr</a>
                <a target="_blank" href="http://sojourner:32400">plex</a>
            </nav>
        </section>
    </header>
</body>

</html>
